[project]
name = "pairs"
version = "0.1.0"
description = "Pairs trading research: spread mean-reversion signal with honest out-of-sample validation"
readme = "README.md"
authors = [
    { name = "gianleonardosalvemini-tech", email = "gianleonardo.salvemini@outlook.it" }
]
requires-python = "==3.12.*"
dependencies = [
    "kaleido>=1.5.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/W pycodestyle (PEP 8), F pyflakes, I isort, N naming, UP pyupgrade, B bugbear,
# D docstrings (NumPy convention), ANN type hints, T20 no print, FA future annotations
select = ["E", "W", "F", "I", "N", "UP", "B", "D", "ANN", "T20", "FA", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"notebooks/**" = ["D", "T20", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# nbformat ships no type hints for read(); used only by the notebook test
untyped_calls_exclude = ["nbformat"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "yfinance.*", "plotly.*", "kaleido.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
